<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyline</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #15112a;
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* Safe-area layout. Every interactive window lies inside image box
     x 173–1592, y 24–930 (centre 882.5, 477). --k is screen px per image px:
     cover the viewport, unless that would crop the safe box — then shrink just
     enough to fit it. The stage is offset to centre the safe box, clamped so the
     picture never pulls away from an edge it can still cover. Any leftover strip
     shows the blurred copy of the picture behind it (body::before).
     The stage keeps the image's aspect ratio, so hotspots stay glued to windows. */
  :root { --vw: 100vw; --vh: 100vh; }
  @supports (height: 100dvh) { :root { --vh: 100dvh; } }
  .stage {
    --k: min(max(var(--vw) / 1672, var(--vh) / 941), var(--vw) / 1419, var(--vh) / 906);
    --spare-x: calc(var(--vw) - var(--k) * 1672);
    --spare-y: calc(var(--vh) - var(--k) * 941);
    position: absolute;
    left: clamp(min(var(--spare-x), var(--spare-x) / 2),
                calc(var(--vw) / 2 - var(--k) * 882.5),
                max(0px, var(--spare-x) / 2));
    top:  clamp(min(var(--spare-y), var(--spare-y) / 2),
                calc(var(--vh) / 2 - var(--k) * 477),
                max(0px, var(--spare-y) / 2));
    width: calc(var(--k) * 1672);
    aspect-ratio: 1672 / 941;
    user-select: none;
    /* feather the edges (30 image px) into the blurred fill instead of a hard seam */
    --feather: calc(var(--k) * 30);
    -webkit-mask-image:
      linear-gradient(to right, transparent, #000 var(--feather), #000 calc(100% - var(--feather)), transparent),
      linear-gradient(to bottom, transparent, #000 var(--feather), #000 calc(100% - var(--feather)), transparent);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent, #000 var(--feather), #000 calc(100% - var(--feather)), transparent),
      linear-gradient(to bottom, transparent, #000 var(--feather), #000 calc(100% - var(--feather)), transparent);
    mask-composite: intersect;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -60px;
    /* stretched, not cropped: each side of the screen picks up the colour of the
       same side of the picture, so the fill continues the feathered edge */
    background: url(skyline.png) center / 100% 100%;
    filter: blur(28px) brightness(.8);
  }
  /* Phones: plain cover, centred, as before — some windows may be cropped. */
  @media (max-width: 767px) {
    .stage {
      --k: max(var(--vw) / 1672, var(--vh) / 941);
      left: calc(var(--spare-x) / 2);
      top: calc(var(--spare-y) / 2);
    }
  }
  .art { display: block; width: 100%; height: 100%; }
  .fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }

  /* ---- clickable windows ---- */
  .hit { fill: #000; fill-opacity: 0; pointer-events: all; cursor: pointer; touch-action: manipulation; }
  .glow { pointer-events: none; opacity: 0; transition: opacity .35s ease; mix-blend-mode: screen; }
  .glow-bloom { filter: url(#bloom); }
  .win:hover .glow-bloom { opacity: .26; }
  .win:hover .glow-core  { opacity: .11; }
  /* Keyboard focus only. :focus-within would keep the glow lit after a click,
     because clicking the hotspot focuses it and focus outlives the pointer. */
  .win:has(.hit:focus-visible) .glow-bloom { opacity: .26; }
  .win:has(.hit:focus-visible) .glow-core  { opacity: .11; }
  .hit:focus-visible { outline: none; }

  /* Hint dot: marks a window as clickable. A halo swells off it and fades, so it
     catches the eye; the whole dot hides while its window's animation plays. */
  .dot { pointer-events: none; transition: opacity .3s ease; }
  .win.playing .dot { opacity: 0; }
  .dot circle { filter: url(#dotBlur); transform-box: fill-box; transform-origin: center; }
  .dot-core { fill: #fffaf0; animation: dotBreathe 2.6s ease-in-out infinite; }
  .dot-halo { fill: #ffe6c2; animation: dotRipple 2.6s ease-out infinite; }
  @keyframes dotBreathe {
    0%, 100% { opacity: .8; transform: scale(.9); }
    15%      { opacity: 1;  transform: scale(1.1); }
  }
  @keyframes dotRipple {
    0%   { opacity: .75; transform: scale(.45); }
    70%, 100% { opacity: 0; transform: scale(1.25); }
  }

  /* ---- shared ---- */
  .anim { opacity: 0; }
  .playing .anim { opacity: 1; }

  /* ---- 1. cat on the sill ---- */
  .cat-hop { transform-box: fill-box; transform-origin: center bottom; transform: translate(-6px, 62px); }
  .playing .cat-hop { animation: catHop 2.8s both; }
  @keyframes catHop {
    0%   { transform: translate(-7px, 62px) scale(.94, 1.08); animation-timing-function: cubic-bezier(.2,.5,.5,1); }
    13%  { transform: translate(-5px, 6px)  scale(.94, 1.08); }
    21%  { transform: translate(-2px,-19px) scale(.97, 1.04); animation-timing-function: cubic-bezier(.5,0,.8,.7); }
    29%  { transform: translate(0, 2px)     scale(1.12, .88); }
    35%  { transform: translate(0, 0)       scale(.97, 1.03); }
    41%  { transform: translate(0, 0)       scale(1, 1); }
    73%  { transform: translate(0, 0)       scale(1, 1); }
    79%  { transform: translate(0, 2px)     scale(1.08, .9); animation-timing-function: cubic-bezier(.2,.6,.5,1); }
    89%  { transform: translate(12px,-20px) scale(.95, 1.06); animation-timing-function: cubic-bezier(.5,0,.9,.6); }
    100% { transform: translate(22px, 58px) scale(.95, 1.06); }
  }
  .cat-tail { transform-box: fill-box; transform-origin: right bottom; }
  .playing .cat-tail { animation: tailFlick .62s ease-in-out 1.25s 2; }
  @keyframes tailFlick {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-18deg); }
  }
  .cat-head { transform-box: fill-box; transform-origin: center bottom; }
  .playing .cat-head { animation: headTilt .9s ease-in-out 1.35s 1; }
  @keyframes headTilt {
    0%, 100% { transform: rotate(0deg); }
    40%, 60% { transform: rotate(9deg); }
  }

  /* ---- 2. blinds drop & rise ---- */
  .blind { transform-box: fill-box; transform-origin: center top; transform: scaleY(.03); }
  .playing .blind { animation: blindsShut 2.6s both; }
  @keyframes blindsShut {
    0%   { transform: scaleY(.03); opacity: 0; animation-timing-function: cubic-bezier(.5,0,.75,.9); }
    4%   { opacity: 1; }
    16%  { transform: scaleY(1); animation-timing-function: ease-out; }
    21%  { transform: scaleY(.955); animation-timing-function: ease-in-out; }
    27%  { transform: scaleY(1); }
    52%  { transform: scaleY(1); animation-timing-function: cubic-bezier(.45,.02,.45,1); }
    94%  { opacity: 1; }
    100% { transform: scaleY(.03); opacity: 0; }
  }

  /* ---- 3. dancer pops up and dances (sprite sheet, 4 frames) ---- */
  .person-rise { transform: translateY(46px); }
  .playing .person-rise { animation: personRise 2.8s both; }
  @keyframes personRise {
    0%   { transform: translateY(46px); animation-timing-function: cubic-bezier(.3,.6,.4,1); }
    9%   { transform: translateY(-5px); }
    13.5%{ transform: translateY(0); }
    86%  { transform: translateY(0); animation-timing-function: ease-in; }
    90%  { transform: translateY(5px); }
    100% { transform: translateY(46px); }
  }
  /* One step = one 1017.5-unit cell, nudged so every pose lands on the same
     hips — he leans and swings, but doesn't slide sideways. 200ms = 5 fps. */
  .playing .dancer-sheet { animation: dancerFrames 2.8s step-end both; }
  @keyframes dancerFrames {
    0%     { transform: translateX(-54px); }      /* 1 — neutral, rising  */
    13.57% { transform: translateX(-1017.5px); }  /* 2 */
    20.71% { transform: translateX(-2022.5px); }  /* 3 */
    27.86% { transform: translateX(-3015px); }    /* 4 */
    35%    { transform: translateX(-2022.5px); }  /* 3 */
    42.14% { transform: translateX(-1017.5px); }  /* 2 */
    49.29% { transform: translateX(-2022.5px); }  /* 3 */
    56.43% { transform: translateX(-3015px); }    /* 4 */
    63.57% { transform: translateX(-2022.5px); }  /* 3 */
    70.71% { transform: translateX(-1017.5px); }  /* 2 */
    77.86% { transform: translateX(-54px); }      /* 1 — neutral, sinking */
    100%   { transform: translateX(-54px); }
  }

  /* ---- 4. dark window: light switches on, flickers, switches off ---- */
  .flicker { opacity: 0; }
  .playing .flicker { animation: windowFlicker 2.8s step-end both; }
  @keyframes windowFlicker {
    0%    { opacity: 0; }
    1.5%  { opacity: 1; }      /* snaps on */
    3.5%  { opacity: .3; }
    5%    { opacity: 1; }
    7%    { opacity: .55; }
    10%   { opacity: .9; }
    13%   { opacity: .7; }
    17%   { opacity: .95; }
    20%   { opacity: .6; animation-timing-function: linear; }
    30%   { opacity: .82; }    /* slow drift — a quiet scene */
    33%   { opacity: 1; }
    36%   { opacity: .5; }
    38%   { opacity: .9; }
    43%   { opacity: .75; }
    46%   { opacity: .95; }
    49%   { opacity: .45; }
    51%   { opacity: .85; }
    56%   { opacity: .7; animation-timing-function: linear; }
    63%   { opacity: .95; }
    66%   { opacity: .55; }
    69%   { opacity: .9; }
    73%   { opacity: .65; }
    76%   { opacity: 1; }
    79%   { opacity: .5; }
    82%   { opacity: .88; }
    86%   { opacity: .72; }
    89%   { opacity: .95; }
    92%   { opacity: .6; }
    95%   { opacity: .9; }
    97%   { opacity: .25; }
    98.5% { opacity: .65; }
    100%  { opacity: 0; }      /* off again */
  }

  /* ---- 5 & 6. potted plants grow and bloom (sprite sheet, 6 frames) ---- */
  /* plant.png: 6 cells of 280 units, every pot centred on the same baseline, so
     frames step straight through with no per-frame nudges. Frame 1 matches the
     painted plant; 2–4 grow; 5–6 are in bloom and alternate to sway. */
  .playing .plant-sheet { animation: plantGrow 3.2s step-end both; }
  @keyframes plantGrow {
    0%   { transform: translateX(0); }        /* 1 — the painted plant */
    6%   { transform: translateX(-280px); }   /* 2 */
    13%  { transform: translateX(-560px); }   /* 3 — bud */
    20%  { transform: translateX(-840px); }   /* 4 — opening */
    27%  { transform: translateX(-1120px); }  /* 5 — in bloom */
    40%  { transform: translateX(-1400px); }  /* 6 — sway */
    50%  { transform: translateX(-1120px); }
    60%  { transform: translateX(-1400px); }
    70%  { transform: translateX(-1120px); }
    80%  { transform: translateX(-840px); }   /* wilting back */
    86%  { transform: translateX(-560px); }
    92%  { transform: translateX(-280px); }
    97%  { transform: translateX(0); }
    100% { transform: translateX(0); }
  }

  /* ---- 7 & 8. curtains close and reopen (sprite sheet, 5 frames) ---- */
  /* curtain.png: 5 cells of 360 units, each cropped to its rod so rod and hem line up.
     1 open · 2 half · 3 closed · 4 closed with a peek gap · 5 closed. The open
     curtains aren't in the painting, so the whole sprite fades in and out. */
  .playing .curtain-fade { animation: curtainFade 3.2s linear both; }
  @keyframes curtainFade {
    0%       { opacity: 0; }
    6%, 92%  { opacity: 1; }
    100%     { opacity: 0; }
  }
  .playing .curtain-sheet { animation: curtainClose 3.2s step-end both; }
  @keyframes curtainClose {
    0%   { transform: translateX(0); }        /* 1 — open */
    10%  { transform: translateX(-360px); }   /* 2 — drawing */
    17%  { transform: translateX(-720px); }   /* 3 — closed */
    50%  { transform: translateX(-1080px); }  /* 4 — someone peeks */
    58%  { transform: translateX(-1440px); }  /* 5 — closed again */
    78%  { transform: translateX(-720px); }   /* 3 */
    83%  { transform: translateX(-360px); }   /* 2 — drawing back */
    89%  { transform: translateX(0); }        /* 1 — open */
    100% { transform: translateX(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .playing .cat-hop, .playing .cat-tail, .playing .cat-head,
    .playing .blind, .playing .person-rise, .playing .dancer-sheet,
    .playing .flicker, .playing .plant-sheet,
    .playing .curtain-fade, .playing .curtain-sheet {
      animation-duration: .01ms;
      animation-iteration-count: 1;
    }
    .dot-core { animation: none; opacity: 1; }
    .dot-halo { animation: none; opacity: .3; transform: scale(.7); }
  }
</style>
</head>
<body>

<div class="stage">
  <img class="art" src="skyline.png" alt="Illustrated city skyline at dusk">

  <svg class="fx" viewBox="0 0 1672 941" preserveAspectRatio="none">
    <defs>
      <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>

      <clipPath id="clipCat">
        <path d="M1439,176 L1576,152 L1576,247 L1439,268 Z"/>
      </clipPath>
      <clipPath id="clipBlind">
        <path d="M1439,377 L1576,361 L1576,562 L1439,572 Z"/>
      </clipPath>
      <!-- both panes, minus the mid-rail: the dancer passes behind the sash -->
      <clipPath id="clipPerson">
        <path d="M187,656 L233,656 L233,703 L187,703 Z M187,706 L233,706 L233,750 L187,750 Z"/>
      </clipPath>

      <clipPath id="clipPlantRB">
        <path d="M1440,677 L1576,671 L1576,818 L1440,820 Z"/>
      </clipPath>
      <!-- both panes, minus the mid-rail -->
      <clipPath id="clipPlantLT">
        <path d="M299,487 H349 V534 H299 Z M299,538 H349 V583.5 H299 Z"/>
      </clipPath>

      <!-- back-right building, wide lit windows: both panes, minus the mid-rail -->
      <clipPath id="clipCurtainMid"><path d="M1165,751 H1190 V768 H1165 Z M1165,770 H1190 V787 H1165 Z"/></clipPath>
      <clipPath id="clipCurtainLow"><path d="M1165,879 H1190 V896 H1165 Z M1165,898 H1190 V915 H1165 Z"/></clipPath>

      <!-- back-right building, narrow lit windows: both panes, minus the mid-rail -->
      <clipPath id="clipBlindA"><path d="M1234,688 H1248 V705 H1234 Z M1234,707 H1248 V723.5 H1234 Z"/></clipPath>
      <clipPath id="clipBlindB"><path d="M1068,752 H1083 V768 H1068 Z M1068,770 H1083 V787 H1068 Z"/></clipPath>
      <!-- the same slats at the scale of the distant building (pitch 2.2, ~2px like the
           blinds already painted in window B) -->
      <pattern id="slatsSmall" x="0" y="0" width="2.2" height="2.2" patternUnits="userSpaceOnUse">
        <rect x="0" y="0"   width="2.2" height=".45" fill="#eb9a68"/>
        <rect x="0" y=".45" width="2.2" height=".2"  fill="#b5755f"/>
        <rect x="0" y=".65" width="2.2" height="1.55" fill="#84545f"/>
      </pattern>

      <!-- slats matched to the blinds already painted in the window -->
      <pattern id="slats" x="0" y="377" width="10.4" height="10.4" patternUnits="userSpaceOnUse">
        <rect x="0" y="0"   width="10.4" height="1.7" fill="#eb9a68"/>
        <rect x="0" y="1.7" width="10.4" height="0.9" fill="#b5755f"/>
        <rect x="0" y="2.6" width="10.4" height="7.8" fill="#84545f"/>
      </pattern>
      <!-- Same lamp light as the building's other windows: a dim band and a
           bright band with a hard edge, sampled from the lit window below. -->
      <linearGradient id="windowLight" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#b36855"/>
        <stop offset=".53" stop-color="#b36855"/>
        <stop offset=".53" stop-color="#f7af6a"/>
        <stop offset="1" stop-color="#f7af6a"/>
      </linearGradient>
      <filter id="flickerBloom" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="3.5"/>
      </filter>

      <!-- blur in bounding-box units, so it scales with each dot's radius -->
      <filter id="dotBlur" x="-1" y="-1" width="3" height="3" primitiveUnits="objectBoundingBox">
        <feGaussianBlur stdDeviation=".22"/>
      </filter>

      <linearGradient id="blindLight" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#2d1b3a" stop-opacity=".22"/>
        <stop offset=".55" stop-color="#2d1b3a" stop-opacity="0"/>
        <stop offset="1" stop-color="#ffc98f" stop-opacity=".16"/>
      </linearGradient>
    </defs>

    <!-- ============ 1. right building, top window: cat ============ -->
    <g class="win" data-dur="2800">
      <path class="glow glow-bloom" fill="#ffc078" d="M1439,68 L1576,41 L1576,143 L1439,165 Z M1439,176 L1576,152 L1576,247 L1439,268 Z"/>
      <path class="glow glow-core"  fill="#ffd8a4" d="M1439,68 L1576,41 L1576,143 L1439,165 Z M1439,176 L1576,152 L1576,247 L1439,268 Z"/>

      <g class="anim" clip-path="url(#clipCat)">
        <g class="cat-hop">
          <g transform="translate(1521,256)" opacity=".68" fill="#241a30">
            <path class="cat-tail" d="M-10,-3 C-19.5,-2 -23,-9.5 -18.5,-15.5"
                  fill="none" stroke="#241a30" stroke-width="4.6" stroke-linecap="round"/>
            <path d="M-12.5,0 C-14,-11 -10.5,-21 -4.5,-25 C0,-28 5,-26.5 7.5,-22 C10.5,-16 11.5,-7 10.5,0 Z"/>
            <g class="cat-head">
              <path d="M-5.6,-37 L-6.8,-46.5 L1.2,-40.6 Z"/>
              <path d="M7.8,-37 L9.4,-46.2 L1.6,-41 Z"/>
              <circle cx="1" cy="-33" r="8.3"/>
            </g>
          </g>
        </g>
      </g>

      <g class="dot">
        <circle class="dot-halo" cx="1562" cy="57" r="16.9"/>
        <circle class="dot-core" cx="1562" cy="57" r="6.5"/>
      </g>

      <path class="hit" tabindex="0" role="button" aria-label="Top window: cat"
            d="M1433,62 L1580,34 L1580,252 L1433,274 Z"/>
    </g>

    <!-- ============ 2. right building, middle window: blinds ============ -->
    <g class="win" data-dur="2600">
      <path class="glow glow-bloom" fill="#ffc078" d="M1439,377 L1576,361 L1576,459 L1439,473 Z M1439,481 L1576,468 L1576,562 L1439,572 Z"/>
      <path class="glow glow-core"  fill="#ffd8a4" d="M1439,377 L1576,361 L1576,459 L1439,473 Z M1439,481 L1576,468 L1576,562 L1439,572 Z"/>

      <g class="anim" clip-path="url(#clipBlind)">
        <g transform="rotate(-6.3 1439 377)">
          <g class="blind">
            <rect x="1405" y="377" width="190" height="205" fill="url(#slats)"/>
            <rect x="1405" y="377" width="190" height="205" fill="url(#blindLight)"/>
          </g>
        </g>
      </g>

      <g class="dot">
        <circle class="dot-halo" cx="1562" cy="375" r="16.9"/>
        <circle class="dot-core" cx="1562" cy="375" r="6.5"/>
      </g>

      <path class="hit" tabindex="0" role="button" aria-label="Middle window: blinds"
            d="M1433,372 L1580,355 L1580,567 L1433,578 Z"/>
    </g>

    <!-- ============ 3. left building, middle row, center window: person ============ -->
    <g class="win" data-dur="2800">
      <path class="glow glow-bloom" fill="#ffc078" d="M187,656 L233,656 L233,703 L187,703 Z M187,706 L233,706 L233,750 L187,750 Z"/>
      <path class="glow glow-core"  fill="#ffd8a4" d="M187,656 L233,656 L233,703 L187,703 Z M187,706 L233,706 L233,750 L187,750 Z"/>

      <g class="anim" clip-path="url(#clipPerson)">
        <g class="person-rise">
          <!-- translate = where he stands, scale = how big he reads behind the glass -->
          <g class="dancer-place" transform="translate(170.56 688.04) scale(0.088)">
            <svg x="0" y="0" width="1017.5" height="976" viewBox="0 0 1017.5 976">
              <image class="dancer-sheet" href="animation/dance.png"
                     x="0" y="0" width="4070" height="976" opacity=".72"/>
            </svg>
          </g>
        </g>
      </g>

      <g class="dot">
        <circle class="dot-halo" cx="226" cy="663" r="11.4"/>
        <circle class="dot-core" cx="226" cy="663" r="4.4"/>
      </g>

      <path class="hit" tabindex="0" role="button" aria-label="Center window: dancer"
            d="M183,651 L237,651 L237,754 L183,754 Z"/>
    </g>

    <!-- ===== 4. mid-ground building, unlit window: light switches on ===== -->
    <g class="win" data-dur="2800">
      <path class="glow glow-bloom" fill="#ffc078" d="M642.5,705.5 H658.5 V720.5 H642.5 Z M642.5,722.5 H658.5 V736 H642.5 Z"/>
      <path class="glow glow-core"  fill="#ffd8a4" d="M642.5,705.5 H658.5 V720.5 H642.5 Z M642.5,722.5 H658.5 V736 H642.5 Z"/>

      <g class="anim">
        <g class="flicker">
          <!-- light spilling past the reveal, same trick as the hover bloom -->
          <rect x="642.5" y="705.5" width="16" height="30.5" fill="#ffc078"
                opacity=".45" filter="url(#flickerBloom)"/>
          <!-- two panes with the sash left dark, matching the lit windows nearby -->
          <rect x="642.5" y="705.5" width="16" height="15" fill="url(#windowLight)"/>
          <rect x="642.5" y="722.5" width="16" height="13.5" fill="url(#windowLight)"/>
        </g>
      </g>

      <g class="dot">
        <circle class="dot-halo" cx="655" cy="709" r="7.8"/>
        <circle class="dot-core" cx="655" cy="709" r="3"/>
      </g>

      <path class="hit" tabindex="0" role="button" aria-label="Unlit window: light flickers on"
            d="M637,700 L664,700 L664,742 L637,742 Z"/>
    </g>

    <!-- ===== 5. right building, bottom window: plant grows ===== -->
    <g class="win" data-dur="3200">
      <path class="glow glow-bloom" fill="#ffc078" d="M1440,677 L1576,671 L1576,818 L1440,820 Z"/>

<script>
  document.querySelectorAll('.win').forEach(win => {
    const duration = Number(win.dataset.dur) || 2800;
    let timer = null;

    const play = () => {
      if (win.classList.contains('playing')) return;
      win.classList.add('playing');
      timer = setTimeout(() => win.classList.remove('playing'), duration);
    };

    win.addEventListener('click', play);
    win.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); }
    });
  });
</script>
